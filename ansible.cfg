# Repo-wide Ansible settings. Semaphore runs ansible-playbook from the repo
# root, so this file is picked up automatically there and locally.
# Inventory is intentionally NOT set: it is supplied by Semaphore (or by
# `-i local/inventory.yml` when testing locally).

[defaults]
remote_user = ansible
roles_path = ./roles
collections_path = ./.ansible/collections:~/.ansible/collections:/usr/share/ansible/collections
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml
forks = 10

[privilege_escalation]
# The `ansible` user has NO sudo rights and playbooks must not escalate.
# Enforced by the custom ansible-lint rule in lint-rules/no_become.py.
become = False
become_ask_pass = False

[ssh_connection]
# Uses the system OpenSSH client, so ~/.ssh/config (ProxyCommand etc.) applies.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=60
